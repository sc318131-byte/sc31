<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <title>董事長行程</title>
  <meta name="theme-color" content="#1f6f5c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="董事長行程">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest-schedule.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/schedule-192.png">
  <link rel="apple-touch-icon" href="icons/schedule-apple-180.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="schedule.css">
</head>
<body>
  <header class="site-header">
    <h1>董事長行程</h1>
    <p class="subtitle">點行程可看詳細內容。行程開始前會用 LINE 提醒管理者。</p>
    <div class="install">
      <button id="install-btn" type="button" class="secondary" hidden>安裝 App</button>
      <p id="install-tip" class="note" hidden></p>
    </div>
  </header>

  <main>
    <section id="calendar-view" class="card" aria-labelledby="cal-title">
      <div class="list-head">
        <h2 id="cal-title">行程日曆</h2>
        <button id="refresh-btn" type="button" class="secondary">重新整理</button>
      </div>
      <div id="cal-message" class="message" role="status" aria-live="polite" hidden></div>
      <div id="calendar"></div>
      <ul class="status-legend" aria-label="狀態圖例">
        <li><span class="swatch s-planned"></span>預定</li>
        <li><span class="swatch s-done"></span>已完成</li>
        <li><span class="swatch s-cancel"></span>已取消</li>
      </ul>
      <p class="note view-only">此頁只供查看。新增或修改行程請到 Supabase 後台操作。</p>
    </section>
  </main>

  <!-- 行程詳細內容（唯讀） -->
  <dialog id="event-dialog" aria-labelledby="dialog-title">
    <div class="dialog-body">
      <h2 id="dialog-title"></h2>
      <dl class="detail">
        <dt>時間</dt><dd id="d-time"></dd>
        <dt>地點</dt><dd id="d-location"></dd>
        <dt>狀態</dt><dd id="d-status"></dd>
        <dt>備註</dt><dd id="d-note"></dd>
        <dt>回報說明</dt><dd id="d-report"></dd>
      </dl>
      <div class="dialog-actions">
        <span class="spacer"></span>
        <button id="close-btn" type="button">關閉</button>
      </div>
    </div>
  </dialog>

  <footer class="site-footer"><a href="./">報修登記</a>・董事長行程</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.15/locales/zh-tw.global.min.js"></script>
  <script src="config.js"></script>
  <script src="schedule.js"></script>
  <script src="pwa.js"></script>
</body>
</html>
