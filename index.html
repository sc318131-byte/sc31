<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>報修登記</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>報修登記</h1>
    <p class="subtitle">填寫下方表單送出報修，送出後會出現在清單中。</p>
  </header>

  <main>
    <section class="card" aria-labelledby="form-title">
      <h2 id="form-title">新增報修</h2>

      <form id="repair-form" novalidate>
        <div class="field">
          <label for="reporter_name">報修人 <span class="req" aria-hidden="true">*</span></label>
          <input id="reporter_name" name="reporter_name" type="text" required maxlength="50"
                 autocomplete="name" placeholder="例：王小明">
        </div>

        <div class="field">
          <label for="location">地點或部門 <span class="req" aria-hidden="true">*</span></label>
          <input id="location" name="location" type="text" required maxlength="100"
                 placeholder="例：總務部、工地B區">
        </div>

        <div class="row">
          <div class="field">
            <label for="category">類別 <span class="req" aria-hidden="true">*</span></label>
            <select id="category" name="category" required>
              <option value="" selected disabled>請選擇</option>
              <option value="設備">設備</option>
              <option value="網路">網路</option>
              <option value="環境">環境</option>
              <option value="其他">其他</option>
            </select>
          </div>

          <fieldset class="field">
            <legend>緊急程度 <span class="req" aria-hidden="true">*</span></legend>
            <div class="segmented">
              <label><input type="radio" name="urgency" value="低"><span>低</span></label>
              <label><input type="radio" name="urgency" value="中" checked><span>中</span></label>
              <label><input type="radio" name="urgency" value="高"><span>高</span></label>
            </div>
          </fieldset>
        </div>

        <div class="field">
          <label for="description">問題說明 <span class="req" aria-hidden="true">*</span></label>
          <textarea id="description" name="description" rows="4" required maxlength="1000"
                    placeholder="請描述發生什麼問題"></textarea>
          <div class="hint"><span id="desc-count">0</span> / 1000 字</div>
        </div>

        <p class="note">標示 * 的欄位為必填。這是示範系統，請勿填寫真實姓名與地點，送出後任何人都能看到清單。</p>

        <div id="form-message" class="message" role="status" aria-live="polite" hidden></div>

        <button id="submit-btn" type="submit">送出報修</button>
      </form>
    </section>

    <section class="card" aria-labelledby="list-title">
      <div class="list-head">
        <h2 id="list-title">最近 20 筆報修</h2>
        <button id="refresh-btn" type="button" class="secondary">重新整理</button>
      </div>
      <div id="list-message" class="message" role="status" aria-live="polite" hidden></div>
      <ul id="repair-list" class="repair-list"></ul>
    </section>
  </main>

  <footer class="site-footer">報修登記系統（示範資料，全為虛構）</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
